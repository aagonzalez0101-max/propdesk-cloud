name: propdesk
# Always-on PropDesk jobs: promos, line moves on watched players, sharp value -> Discord / ntfy.
# Runs hourly at :07 (GitHub may delay scheduled runs a few minutes). Free on a private repo: ~1-2 min x 24/day < 2,000 min/month.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: propdesk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run.py
      - name: save state
        run: |
          git config user.name "propdesk-bot"
          git config user.email "propdesk-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --quiet || true
          git push || true
