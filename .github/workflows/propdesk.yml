name: propdesk
# Always-on PropDesk jobs: promos, league line-move digests (everyone's lines), sharp value -> Discord / ntfy.
# Every 10 minutes (public repo = unlimited free minutes). Fast leagues every run, medium every 30 min, slow every hour.
# GitHub can delay scheduled runs by a few minutes under load.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: propdesk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python run.py
      - name: save state
        run: |
          git config user.name "propdesk-bot"
          git config user.email "propdesk-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --quiet || true
          git push || true
